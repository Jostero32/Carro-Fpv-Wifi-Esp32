[project]
name = "carrito-pc"
version = "0.1.0"
description = "App de escritorio para controlar el carrito ESP32 por WiFi"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pygame-ce",
    "pywebview",
    "zeroconf",
]

[project.scripts]
carrito-pc = "carrito_pc.__main__:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carrito_pc"]
