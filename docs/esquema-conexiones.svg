<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" width="1080" height="700" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Carro FPV: esquema de conexiones del carro</title>
  <style>
    .card { fill: #ffffff; stroke: #e5e7eb; }
    .t { fill: #111827; }
    .muted { fill: #6b7280; }
    .pinlbl { fill: #e5e7eb; font-size: 12px; font-family: Consolas, Menlo, monospace; }
    .pinused { fill: #facc15; font-weight: 700; }
    .sig { stroke: #2563eb; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
    .pwm { stroke: #7c3aed; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
    .srv { stroke: #ea580c; stroke-width: 2.5; fill: none; }
    .pwr { stroke: #dc2626; stroke-width: 3; fill: none; stroke-linejoin: round; }
    .gnd { stroke: #374151; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
    .mot { stroke: #111827; stroke-width: 2; fill: none; }
    .lbl { font-size: 13px; fill: #111827; }
    .sub { font-size: 12px; fill: #6b7280; }
    .blk { font-size: 12px; fill: #ffffff; font-family: Consolas, Menlo, monospace; font-weight: 700; }
  </style>

  <rect class="card" x="1" y="1" width="1078" height="698" rx="14"/>
  <text class="t" x="40" y="40" font-size="20" font-weight="700">Carro FPV · esquema de conexiones</text>
  <text class="muted" x="40" y="62" font-size="13">ESP32 DevKit V1 + puente H L298N + servo MG995 · pines por defecto de firmware/carrito/config.example.h</text>

  <!-- ESP32 DevKit V1 -->
  <rect x="40" y="100" width="230" height="480" rx="10" fill="#1b2533"/>
  <rect x="62" y="116" width="140" height="150" rx="4" fill="#9ca3af"/>
  <rect x="72" y="126" width="120" height="96" rx="2" fill="#6b7280"/>
  <text x="132" y="180" text-anchor="middle" font-size="12" fill="#f9fafb" font-weight="700">ESP32-WROOM-32</text>
  <path d="M74 234 h20 v-8 h12 v8 h12 v-8 h12 v8 h12 v-8 h12 v8 h20" stroke="#374151" stroke-width="2" fill="none"/>
  <rect x="125" y="568" width="60" height="26" rx="4" fill="#9ca3af"/>
  <text x="155" y="612" text-anchor="middle" class="sub">USB</text>
  <circle cx="155" cy="330" r="5" fill="#3b82f6"/><text x="155" y="352" text-anchor="middle" font-size="10" fill="#9ca3af">LED GPIO2</text>
  <text x="155" y="372" text-anchor="middle" font-size="10" fill="#9ca3af">estado Wi-Fi / failsafe</text>

  <g>
    <text class="pinlbl pinused" x="246" y="144" text-anchor="end">D23</text><circle cx="258" cy="140" r="5" fill="#facc15"/>
    <text class="pinlbl" x="246" y="172" text-anchor="end">D22</text><circle cx="258" cy="168" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="200" text-anchor="end">TX0</text><circle cx="258" cy="196" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="228" text-anchor="end">RX0</text><circle cx="258" cy="224" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="256" text-anchor="end">D21</text><circle cx="258" cy="252" r="5" fill="#6b7280"/>
    <text class="pinlbl pinused" x="246" y="284" text-anchor="end">D19</text><circle cx="258" cy="280" r="5" fill="#facc15"/>
    <text class="pinlbl pinused" x="246" y="312" text-anchor="end">D18</text><circle cx="258" cy="308" r="5" fill="#facc15"/>
    <text class="pinlbl pinused" x="246" y="340" text-anchor="end">D5</text><circle cx="258" cy="336" r="5" fill="#facc15"/>
    <text class="pinlbl pinused" x="246" y="368" text-anchor="end">17</text><circle cx="258" cy="364" r="5" fill="#facc15"/>
    <text class="pinlbl pinused" x="246" y="396" text-anchor="end">16</text><circle cx="258" cy="392" r="5" fill="#facc15"/>
    <text class="pinlbl" x="246" y="424" text-anchor="end">D4</text><circle cx="258" cy="420" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="452" text-anchor="end">D2</text><circle cx="258" cy="448" r="5" fill="#6b7280"/>
    <text class="pinlbl pinused" x="246" y="480" text-anchor="end">D15</text><circle cx="258" cy="476" r="5" fill="#facc15"/>
    <text class="pinlbl pinused" x="246" y="508" text-anchor="end">GND</text><circle cx="258" cy="504" r="5" fill="#facc15"/>
    <text class="pinlbl" x="246" y="536" text-anchor="end">3V3</text><circle cx="258" cy="532" r="5" fill="#6b7280"/>
  </g>

  <!-- L298N -->
  <rect x="620" y="120" width="200" height="300" rx="8" fill="#b91c1c"/>
  <rect x="680" y="200" width="80" height="80" rx="4" fill="#111827"/>
  <text x="720" y="245" text-anchor="middle" font-size="13" fill="#f9fafb" font-weight="700">L298N</text>
  <text x="720" y="300" text-anchor="middle" font-size="11" fill="#fecaca">quitar jumpers ENA/ENB</text>
  <g>
    <circle cx="620" cy="160" r="5" fill="#facc15"/><text class="blk" x="630" y="164">ENA</text>
    <circle cx="620" cy="200" r="5" fill="#facc15"/><text class="blk" x="630" y="204">IN1</text>
    <circle cx="620" cy="240" r="5" fill="#facc15"/><text class="blk" x="630" y="244">IN2</text>
    <circle cx="620" cy="280" r="5" fill="#facc15"/><text class="blk" x="630" y="284">ENB</text>
    <circle cx="620" cy="320" r="5" fill="#facc15"/><text class="blk" x="630" y="324">IN3</text>
    <circle cx="620" cy="360" r="5" fill="#facc15"/><text class="blk" x="630" y="364">IN4</text>
    <circle cx="820" cy="170" r="5" fill="#facc15"/><text class="blk" x="810" y="174" text-anchor="end">OUT1</text>
    <circle cx="820" cy="200" r="5" fill="#facc15"/><text class="blk" x="810" y="204" text-anchor="end">OUT2</text>
    <circle cx="820" cy="330" r="5" fill="#facc15"/><text class="blk" x="810" y="334" text-anchor="end">OUT3</text>
    <circle cx="820" cy="360" r="5" fill="#facc15"/><text class="blk" x="810" y="364" text-anchor="end">OUT4</text>
    <circle cx="660" cy="420" r="5" fill="#facc15"/><text class="blk" x="660" y="408" text-anchor="middle">GND</text>
    <circle cx="720" cy="420" r="5" fill="#facc15"/><text class="blk" x="720" y="408" text-anchor="middle">+12V</text>
    <circle cx="780" cy="420" r="5" fill="#fca5a5"/><text class="blk" x="780" y="408" text-anchor="middle">+5V</text>
  </g>

  <!-- ESP32 → L298N (codos sin cruces) -->
  <path class="pwm" d="M263 140 H400 V160 H615"/>
  <path class="sig" d="M263 280 H440 V200 H615"/>
  <path class="sig" d="M263 308 H470 V240 H615"/>
  <path class="pwm" d="M263 336 H500 V280 H615"/>
  <path class="sig" d="M263 364 H530 V320 H615"/>
  <path class="sig" d="M263 392 H560 V360 H615"/>

  <!-- Motores -->
  <path class="mot" d="M825 170 H900 V172 M825 200 H900 V198"/>
  <circle cx="930" cy="185" r="28" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="930" y="191" text-anchor="middle" font-size="16" font-weight="700" class="t">M</text>
  <path class="mot" d="M900 172 L904 172 M900 198 L904 198"/>
  <text class="lbl" x="968" y="182" font-weight="700">Motor</text><text class="lbl" x="968" y="198" font-weight="700">izquierdo</text>
  <path class="mot" d="M825 330 H902 M825 360 H902"/>
  <circle cx="930" cy="345" r="28" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="930" y="351" text-anchor="middle" font-size="16" font-weight="700" class="t">M</text>
  <text class="lbl" x="968" y="342" font-weight="700">Motor</text><text class="lbl" x="968" y="358" font-weight="700">derecho</text>

  <!-- Servo de dirección -->
  <path class="srv" d="M263 476 H420"/>
  <rect x="420" y="456" width="140" height="40" rx="6" fill="#1e3a8a"/>
  <text x="490" y="481" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">Servo MG995</text>
  <text class="sub" x="490" y="520" text-anchor="middle">V+ 5–6 V de un regulador/BEC,</text>
  <text class="sub" x="490" y="536" text-anchor="middle">nunca del 3V3 del ESP32</text>

  <!-- Batería 2S -->
  <rect x="860" y="470" width="170" height="60" rx="8" fill="#f59e0b"/>
  <text x="945" y="497" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Batería 2S</text>
  <text x="945" y="514" text-anchor="middle" font-size="11" fill="#111827">6,4 – 8,4 V</text>
  <text x="884" y="465" font-size="14" font-weight="700" fill="#dc2626">+</text>
  <text x="1010" y="548" font-size="16" font-weight="700" fill="#374151">−</text>
  <path class="pwr" d="M900 470 V450 H720 V425"/>

  <!-- Tierra común -->
  <path class="gnd" d="M263 504 H580 V610"/>
  <path class="gnd" d="M540 496 V504"/>
  <path class="gnd" d="M660 425 V610"/>
  <path class="gnd" d="M1000 530 V610"/>
  <path class="gnd" d="M580 610 H1000"/>
  <g fill="#374151"><circle cx="580" cy="610" r="4"/><circle cx="660" cy="610" r="4"/><circle cx="540" cy="504" r="4"/></g>
  <text class="sub" x="770" y="628" text-anchor="middle">GND común: ESP32 · L298N · servo · batería</text>

  <!-- Notas -->
  <text class="sub" x="40" y="652">• Morado: PWM de velocidad (ENA/ENB, 20 kHz). Azul: sentido de giro. Naranja: señal del servo (GPIO15).</text>
  <text class="sub" x="40" y="672">• Medición de batería (opcional): divisor de tensión a un pin de ADC1, GPIO32 a 39; el ADC2 no funciona con el Wi-Fi activo.</text>
  <text class="sub" x="40" y="692">• La ESP32-CAM va aparte: solo 5 V estables y GND (el sensor ya viene conectado en la placa).</text>
</svg>
