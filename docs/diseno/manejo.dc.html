<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pantalla de manejo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,600;1,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E8EAED}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; height: 100vh; min-height: 800px; overflow: hidden; background-color: #14171C; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 48px 48px; color: #F2F3F5; font-family: Inter, system-ui, sans-serif">

  <div style="position: absolute; left: 0; right: 0; top: 36%; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #8E949B">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg>
    <span style="font-size: 15px">Video en vivo de la ESP32-CAM</span>
  </div>

  <svg style="position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 360px" viewBox="0 0 1000 360" preserveAspectRatio="none" fill="none" aria-hidden="true">
    <path d="M400 360 C 430 250, 500 170, 590 110" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" vector-effect="non-scaling-stroke"></path>
    <path d="M600 360 C 615 260, 650 180, 700 110" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" vector-effect="non-scaling-stroke"></path>
  </svg>

  <div style="position: absolute; top: 20px; left: 24px; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px; background: rgba(8,10,12,0.55)">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: {{carritoColor}}"></span>
    <span style="font-size: 13px; font-weight: 500">{{carritoTexto}}</span>
    <svg width="18" height="14" viewBox="0 0 18 14" role="img" aria-label="Señal buena">
      <rect x="0" y="10" width="3" height="4" rx="1" fill="#F2F3F5"></rect>
      <rect x="5" y="7" width="3" height="7" rx="1" fill="#F2F3F5"></rect>
      <rect x="10" y="4" width="3" height="10" rx="1" fill="#F2F3F5"></rect>
      <rect x="15" y="0" width="3" height="14" rx="1" fill="#F2F3F5" fill-opacity="0.3"></rect>
    </svg>
  </div>

  <div style="position: absolute; top: 20px; right: 24px; display: flex; gap: 8px">
    <a href="Calibracion.dc.html" aria-label="Calibración" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(8,10,12,0.55); color: #F2F3F5">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
    </a>
  </div>

  <div style="position: absolute; left: 32px; bottom: 36px; display: flex; align-items: center; gap: 10px">
    <svg width="22" height="12" viewBox="0 0 22 12" fill="none" role="img" aria-label="Batería 78 por ciento"><rect x="0.75" y="0.75" width="18" height="10.5" rx="2" stroke="#F2F3F5" stroke-width="1.5"></rect><rect x="19.5" y="3.5" width="2" height="5" rx="1" fill="#F2F3F5"></rect><rect x="3" y="3" width="11" height="6" rx="1" fill="#F2F3F5"></rect></svg>
    <div style="width: 120px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18)">
      <div style="width: 94px; height: 4px; border-radius: 2px; background: #F2F3F5"></div>
    </div>
  </div>

  <div style="position: absolute; left: 50%; bottom: 20px; width: 360px; margin-left: -180px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <svg width="360" height="250" viewBox="0 0 360 250" fill="none" role="img" aria-label="Acelerador 64 por ciento, freno 0, marcha adelante">
      <path d="M58.8 235 A140 140 0 1 1 301.2 235" stroke="rgba(255,255,255,0.14)" stroke-width="12" stroke-linecap="round"></path>
      <path d="M58.8 235 A140 140 0 0 1 257.4 48.4" stroke="{{accent}}" stroke-width="12" stroke-linecap="round"></path>
      <path d="M74.3 226 A122 122 0 1 1 285.7 226" stroke="rgba(255,255,255,0.10)" stroke-width="4" stroke-linecap="round"></path>
      <line x1="48.4" y1="241" x2="39.7" y2="246" stroke="{{accent}}" stroke-width="2"></line>
      <line x1="28.8" y1="180.9" x2="18.9" y2="181.9" stroke="{{accent}}" stroke-width="2"></line>
      <line x1="35.4" y1="118" x2="25.9" y2="115" stroke="{{accent}}" stroke-width="2"></line>
      <line x1="67" y1="63.3" x2="60.9" y2="56.6" stroke="{{accent}}" stroke-width="2"></line>
      <line x1="118.2" y1="26.1" x2="114.9" y2="17" stroke="{{accent}}" stroke-width="2"></line>
      <line x1="180" y1="13" x2="180" y2="3" stroke="{{accent}}" stroke-width="2"></line>
      <line x1="241.8" y1="26.1" x2="245.1" y2="17" stroke="{{accent}}" stroke-width="2"></line>
      <line x1="293" y1="63.3" x2="299.1" y2="56.6" stroke="rgba(255,255,255,0.35)" stroke-width="2"></line>
      <line x1="324.6" y1="118" x2="334.1" y2="115" stroke="rgba(255,255,255,0.35)" stroke-width="2"></line>
      <line x1="331.2" y1="180.9" x2="341.1" y2="181.9" stroke="rgba(255,255,255,0.35)" stroke-width="2"></line>
      <line x1="311.6" y1="241" x2="320.3" y2="246" stroke="rgba(255,255,255,0.35)" stroke-width="2"></line>
      <text x="180" y="100" text-anchor="middle" fill="{{accent}}" font-family="Inter, sans-serif" font-size="22" font-weight="700" font-style="italic">D</text>
      <text x="180" y="182" text-anchor="middle" fill="#F2F3F5" font-family="Inter, sans-serif" font-size="84" font-weight="700" font-style="italic" style="text-shadow: 0 2px 8px rgba(0,0,0,0.6)">64</text>
      <text x="180" y="210" text-anchor="middle" fill="#C9CDD2" font-family="Inter, sans-serif" font-size="14" font-weight="500">%</text>
    </svg>
    <div style="position: relative; width: 240px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.2)" role="img" aria-label="Dirección 18 por ciento a la derecha">
      <div style="position: absolute; left: 50%; top: -4px; width: 1px; height: 11px; background: rgba(255,255,255,0.45)"></div>
      <div style="position: absolute; left: 59%; top: -5px; width: 4px; height: 13px; margin-left: -2px; border-radius: 2px; background: #F2F3F5"></div>
    </div>
  </div>

  <div style="position: absolute; right: 32px; bottom: 30px; display: flex; align-items: center; gap: 18px">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Luces encendidas"><path d="M13 5c4 0 7 3 7 7s-3 7-7 7c-1.5 0-2-1-2-2V7c0-1 .5-2 2-2z"></path><line x1="2" y1="8" x2="8" y2="8"></line><line x1="2" y1="12" x2="8" y2="12"></line><line x1="2" y1="16" x2="8" y2="16"></line></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-opacity="0.35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Claxon apagado"><path d="M3 10v4h4l5 4V6L7 10H3z"></path><path d="M16 9a4 4 0 0 1 0 6"></path><path d="M19 6a8 8 0 0 1 0 12"></path></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-opacity="0.35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Turbo apagado"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"></path></svg>
  </div>

  <sc-if value="{{sinSenal}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(36,8,10,0.78); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.7 11.1A11 11 0 0 1 19 12.6"></path><path d="M5 12.6a11 11 0 0 1 5.2-2.5"></path><path d="M10.7 5.1A16 16 0 0 1 22.6 9"></path><path d="M1.4 9a16 16 0 0 1 4.4-2.7"></path><path d="M8.5 16.1a5 5 0 0 1 7 0"></path></svg>
      <span style="font-size: 28px; font-weight: 700">Sin señal del carrito</span>
      <span style="font-size: 16px; color: #F2C9C9">Motores detenidos. Reintentando conexión.</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#4EA8FF","#F5C542"]},"estado":{"editor":"enum","options":["conectado","sin_senal"],"default":"conectado"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF8A3D';
    const ok = (this.props.estado ?? 'conectado') === 'conectado';
    return {
      accent: accent,
      sinSenal: !ok,
      carritoTexto: ok ? 'Conectado' : 'Sin señal',
      carritoColor: ok ? '#3DD68C' : '#FF6B6B'
    };
  }
}
</script>
</body>
</html>
